<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc">
  <title id="title">Smart Leave Engine DynamoDB schema</title>
  <desc id="desc">Visual map of the employees, leave requests, balances, leave type configuration, date locks, workflow tasks, and team absences tables, with known key attributes and relationships.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #132238; }
      .title { font-size: 34px; font-weight: 750; fill: #fff; }
      .subtitle { font-size: 16px; fill: #dbeafe; }
      .card { fill: #fff; stroke: #dbe4ee; stroke-width: 1.5; }
      .tableName { font-size: 21px; font-weight: 700; fill: #fff; }
      .field { font-size: 15px; }
      .type { font-size: 13px; fill: #64748b; }
      .keyText { font-size: 11px; font-weight: 700; }
      .note { font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edgeDash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edgeLabel { font-size: 12px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1510" fill="#f5f8fc"/>
  <rect x="30" y="24" width="1540" height="120" rx="24" fill="url(#header)"/>
  <text class="title" x="66" y="76">Smart Leave Engine · DynamoDB schema</text>
  <text class="subtitle" x="68" y="111">Project tables, key fields, and application relationships · confirm marked details in the deployed tables</text>

  <!-- Relationships are behind the table cards. -->
  <path class="edge" d="M505 285 H565"/>
  <rect x="492" y="250" width="94" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="500" y="267">employee_id</text>

  <path class="edge" d="M1135 398 H1045"/>
  <rect x="1049" y="365" width="120" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="1057" y="382">leave type rules</text>

  <path class="edge" d="M270 600 V730"/>
  <rect x="282" y="644" width="94" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="290" y="661">employee_id</text>

  <path class="edge" d="M505 510 H540 V770 H565"/>
  <rect x="511" y="632" width="94" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="519" y="649">employee_id</text>

  <path class="edge" d="M805 625 V730"/>
  <rect x="817" y="661" width="80" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="825" y="678">request_id</text>

  <path class="edge" d="M1045 570 H1090 V790 H1135"/>
  <rect x="1050" y="650" width="86" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="1058" y="667">request_id</text>

  <path class="edgeDash" d="M1045 595 H1080 V1215 H1045"/>
  <rect x="1062" y="1050" width="105" height="24" rx="12" fill="#f5f8fc"/>
  <text class="edgeLabel" x="1070" y="1067">approved only</text>

  <!-- EMPLOYEES -->
  <g filter="url(#shadow)">
    <rect class="card" x="35" y="200" width="470" height="400" rx="18"/>
    <path d="M53 200 H487 Q505 200 505 218 V260 H35 V218 Q35 200 53 200Z" fill="#0f766e"/>
    <text class="tableName" x="60" y="239">EMPLOYEES</text>
    <text class="type" x="60" y="288">Employee identity and manager mapping</text>
    <text class="field" x="60" y="322">employee_id</text><text class="type" x="330" y="322">String</text><rect x="390" y="303" width="85" height="26" rx="13" fill="#d1fae5"/><text class="keyText" x="405" y="321" fill="#047857">PK</text>
    <text class="field" x="60" y="356">cognito_sub</text><text class="type" x="330" y="356">String</text><rect x="390" y="337" width="85" height="26" rx="13" fill="#ede9fe"/><text class="keyText" x="400" y="355" fill="#6d28d9">GSI</text>
    <text class="field" x="60" y="390">manager_id</text><text class="type" x="330" y="390">String</text><rect x="390" y="371" width="85" height="26" rx="13" fill="#ede9fe"/><text class="keyText" x="400" y="389" fill="#6d28d9">GSI</text>
    <text class="field" x="60" y="424">employee_name · employee_email</text><text class="type" x="330" y="424">String</text>
    <text class="field" x="60" y="458">department · designation</text><text class="type" x="330" y="458">String</text>
    <text class="field" x="60" y="492">role · hrmanager_id</text><text class="type" x="330" y="492">String</text>
    <rect x="58" y="525" width="424" height="49" rx="12" fill="#f0fdfa"/>
    <text class="note" x="72" y="546">Indexes shown in Console: CognitoSubIndex,</text>
    <text class="note" x="72" y="565">ManagerTeamIndex · verify sort keys/projection.</text>
  </g>

  <!-- LEAVE REQUESTS -->
  <g filter="url(#shadow)">
    <rect class="card" x="565" y="200" width="480" height="425" rx="18"/>
    <path d="M583 200 H1027 Q1045 200 1045 218 V260 H565 V218 Q565 200 583 200Z" fill="#2563eb"/>
    <text class="tableName" x="590" y="239">LEAVE_REQUESTS</text>
    <text class="type" x="590" y="288">Request record · one employee can have many</text>
    <text class="field" x="590" y="322">employee_id</text><text class="type" x="875" y="322">String</text><rect x="935" y="303" width="85" height="26" rx="13" fill="#d1fae5"/><text class="keyText" x="950" y="321" fill="#047857">PK</text>
    <text class="field" x="590" y="356">request_id</text><text class="type" x="875" y="356">String</text><rect x="935" y="337" width="85" height="26" rx="13" fill="#dbeafe"/><text class="keyText" x="950" y="355" fill="#1d4ed8">SK</text>
    <text class="field" x="590" y="390">leave_type · status</text><text class="type" x="875" y="390">String</text>
    <text class="field" x="590" y="424">start_date · end_date (YYYY-MM-DD)</text><text class="type" x="875" y="424">String</text>
    <text class="field" x="590" y="458">total_days</text><text class="type" x="875" y="458">Number · weekdays</text>
    <text class="field" x="590" y="492">manager_id · manager_queue_key</text><text class="type" x="875" y="492">String</text>
    <text class="field" x="590" y="526">requires_hr_approval</text><text class="type" x="875" y="526">Boolean</text>
    <text class="field" x="590" y="560">reason · created_at · updated_at</text><text class="type" x="875" y="560">String</text>
    <rect x="588" y="580" width="434" height="28" rx="10" fill="#eff6ff"/>
    <text class="note" x="601" y="599">Manager GSI key details: verify in deployed Indexes tab.</text>
  </g>

  <!-- LEAVE TYPE CONFIG -->
  <g filter="url(#shadow)">
    <rect class="card" x="1135" y="200" width="430" height="300" rx="18"/>
    <path d="M1153 200 H1547 Q1565 200 1565 218 V260 H1135 V218 Q1135 200 1153 200Z" fill="#7c3aed"/>
    <text class="tableName" x="1160" y="239">LEAVE_TYPE_CONFIG</text>
    <text class="type" x="1160" y="288">Rules are read from config, not hard-coded</text>
    <text class="field" x="1160" y="326">leave_type_id</text><text class="type" x="1400" y="326">String · PK</text>
    <text class="field" x="1160" y="362">annual_quota</text><text class="type" x="1400" y="362">Number</text>
    <text class="field" x="1160" y="398">carry_forward_max</text><text class="type" x="1400" y="398">Number</text>
    <text class="field" x="1160" y="434">is_unlimited</text><text class="type" x="1400" y="434">Boolean</text>
    <text class="note" x="1160" y="470">HR threshold field name: verify in Lambda code.</text>
  </g>

  <!-- LEAVE BALANCES -->
  <g filter="url(#shadow)">
    <rect class="card" x="35" y="730" width="470" height="360" rx="18"/>
    <path d="M53 730 H487 Q505 730 505 748 V790 H35 V748 Q35 730 53 730Z" fill="#0891b2"/>
    <text class="tableName" x="60" y="769">LEAVE_BALANCES</text>
    <text class="type" x="60" y="818">One balance item per employee, type, and year</text>
    <text class="field" x="60" y="854">employee_id</text><text class="type" x="330" y="854">String · PK</text>
    <text class="field" x="60" y="890">balance_key (e.g. SICK#2026)</text><text class="type" x="330" y="890">String · SK</text>
    <text class="field" x="60" y="926">allocated · available · used</text><text class="type" x="330" y="926">Number</text>
    <text class="field" x="60" y="962">available_carry_forward_next_year</text><text class="type" x="330" y="962">Number</text>
    <rect x="58" y="990" width="424" height="70" rx="12" fill="#ecfeff"/>
    <text class="note" x="72" y="1017">Only final approval charges paid leave.</text>
    <text class="note" x="72" y="1040">Keep balance values numeric in every item.</text>
  </g>

  <!-- LEAVE DATE LOCKS -->
  <g filter="url(#shadow)">
    <rect class="card" x="565" y="730" width="480" height="260" rx="18"/>
    <path d="M583 730 H1027 Q1045 730 1045 748 V790 H565 V748 Q565 730 583 730Z" fill="#ea580c"/>
    <text class="tableName" x="590" y="769">LEAVE_DATE_LOCKS</text>
    <text class="type" x="590" y="818">Prevents overlapping employee/date claims</text>
    <text class="field" x="590" y="854">employee_id</text><text class="type" x="875" y="854">String · PK</text>
    <text class="field" x="590" y="890">date_key (YYYY-MM-DD)</text><text class="type" x="875" y="890">String · SK</text>
    <text class="field" x="590" y="926">request_id</text><text class="type" x="875" y="926">String</text>
  </g>

  <!-- WORKFLOW TASKS -->
  <g filter="url(#shadow)">
    <rect class="card" x="1135" y="730" width="430" height="300" rx="18"/>
    <path d="M1153 730 H1547 Q1565 730 1565 748 V790 H1135 V748 Q1135 730 1153 730Z" fill="#db2777"/>
    <text class="tableName" x="1160" y="769">LEAVE_WORKFLOW_TASKS</text>
    <text class="type" x="1160" y="818">Step Functions callback token by stage</text>
    <text class="field" x="1160" y="854">request_id</text><text class="type" x="1400" y="854">String · PK</text>
    <text class="field" x="1160" y="890">approval_stage</text><text class="type" x="1400" y="890">String · SK</text>
    <text class="field" x="1160" y="926">task_token</text><text class="type" x="1400" y="926">Secret String</text>
    <text class="field" x="1160" y="962">expires_at</text><text class="type" x="1400" y="962">Number · TTL</text>
    <text class="note" x="1160" y="1004">Never expose real callback tokens.</text>
  </g>

  <!-- TEAM ABSENCES -->
  <g filter="url(#shadow)">
    <rect class="card" x="565" y="1110" width="480" height="235" rx="18"/>
    <path d="M583 1110 H1027 Q1045 1110 1045 1128 V1170 H565 V1128 Q565 1110 583 1110Z" fill="#4f46e5"/>
    <text class="tableName" x="590" y="1149">TEAM_ABSENCES</text>
    <text class="type" x="590" y="1198">Calendar data for approved absences</text>
    <text class="field" x="590" y="1236">Primary key and attributes</text><text class="type" x="820" y="1236">Confirm in AWS</text>
    <text class="note" x="590" y="1284">Do not infer its key schema from the table name.</text>
  </g>

  <rect x="35" y="1390" width="1530" height="78" rx="16" fill="#e2e8f0"/>
  <text class="note" x="60" y="1422">Solid arrows show application-level lookups/relationships; DynamoDB does not enforce foreign keys.</text>
  <text class="note" x="60" y="1448">Index details marked for confirmation should be copied from DynamoDB → Tables → table → Indexes.</text>
</svg>
